<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d10">
<title>Stacks</title>
<style>
  /* Basso's stapel (Stapel.swift, StapelRug), overgenomen en aangepast: een rug is een liggende balk in de kleur van de
     hoes, artiest semibold in t1, titel regular in t2, een verloop eroverheen (wit 10% boven, zwart 18% onder).
     Zonder speelduur (de officiële API geeft die niet) is elke rug even dik: Basso's dikte voor 45 minuten. */
  :root {
    --achter: #0d0d10; --tekst: rgba(255,255,255,.9); --zacht: rgba(255,255,255,.45);
    --rand: max(16px, env(safe-area-inset-left)); --rand-r: max(16px, env(safe-area-inset-right));
    --dikte: 28px; --letter: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--achter); color: var(--tekst);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: calc(env(safe-area-inset-top) + 14px) var(--rand-r) 12px var(--rand);
    background: rgba(13,13,16,.82); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  #tel { color: var(--zacht); font-size: 13px; font-variant-numeric: tabular-nums; }
  /* Naam en aantal op één basislijn (René: "lijnt niet lekker"). */
  .naam { display: flex; align-items: baseline; gap: 12px; }
  .zone { margin-left: auto; }
  /* Het filter (Basso's kamerfilter, René 26 okt: "nog 1 killer feature"): ⌘F of de knop opent het veld; elk woord moet
     voorkomen in titel, artiest, label, catalogusnummer, jaar, formaat of bron — zonder op hoofdletters of accenten te letten. */
  .filter { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border-radius: 15px; width: min(320px, 100%);
    background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 .75px rgba(255,255,255,.12); }
  .filter[hidden] { display: none; }
  .filter .glas { color: #fff; display: flex; } .filter .glas svg { width: 14px; height: 14px; }
  .filter input { flex: 1; min-width: 0; appearance: none; border: 0; background: none; outline: none; color: var(--tekst); font: inherit; font-size: 14px; }
  .filter input::-webkit-search-cancel-button { display: none; }
  .filter .wis { appearance: none; border: 0; background: none; padding: 0; color: rgba(255,255,255,.45); cursor: pointer; display: flex; }
  .filter .wis svg { width: 15px; height: 15px; }
  .kopknop { appearance: none; border: 0; background: rgba(255,255,255,.08); color: var(--tekst); width: 32px; height: 28px; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; margin-left: auto; }
  .kopknop svg { width: 15px; height: 15px; }
  .filter:not([hidden]) + .kopknop { display: none; }
  .kopknop + .zone { margin-left: 0; }
  .filter:not([hidden]) { margin-left: auto; }
  .orde { display: flex; background: rgba(255,255,255,.08); border-radius: 8px; padding: 2px; }
  .orde button { appearance: none; border: 0; background: none; color: var(--tekst); font: inherit; font-size: 13px;
    padding: 5px 12px; border-radius: 6px; cursor: pointer; }
  .orde button[aria-pressed="true"] { background: rgba(255,255,255,.18); font-weight: 600; }
  #stapel { display: flex; flex-direction: column; gap: 1px; padding-bottom: env(safe-area-inset-bottom); }
  .rug { display: flex; align-items: center; gap: 12px; height: var(--h, var(--dikte)); padding: 0 var(--rand-r) 0 var(--rand);
    background-color: var(--bg, #383838);
    background-image: linear-gradient(to bottom, rgba(255,255,255,.10), transparent 50%, rgba(0,0,0,.18));
    font-size: var(--letter); white-space: nowrap; overflow: hidden; cursor: pointer;
    content-visibility: auto; contain-intrinsic-size: auto var(--dikte); }
  .rug b { font-weight: 600; color: var(--t1, #fff); overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  .rug span { color: var(--t2, rgba(255,255,255,.75)); overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .rug b { min-width: 0; }
  /* Met Deep Roon (StapelRug): rechts de speelduur, op een breed scherm het schildje met bitdiepte/samplerate (24/96), en bij de volgorde op
     catalogusnummer dat nummer in een eigen rechterkolom (variant D uit de tekenbank). */
  .rug i { flex: 1 0 8px; }
  /* Het schildje zoals Basso's HI-RES: op zijn eigen breedte, vlak vóór de speelduur; alleen waar het geen cd-kwaliteit
     is (René, 26 okt: "dit ligt gevoelig" — een kolom vol 16/44.1 was ruis, een vaste kolom stond niet). */
  .rug em { flex: 0 0 auto; font-style: normal; font-size: 8px; font-weight: 600; letter-spacing: .6px; font-variant-numeric: tabular-nums;
    color: var(--t2, #fff); opacity: .85; padding: 1px 3px; border: .75px solid color-mix(in srgb, var(--t2, #fff) 55%, transparent); border-radius: 3px; }
  .rug small { font-size: 11px; color: var(--t2, #fff); opacity: .8; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .rug small + small { font-size: 10px; font-weight: 500; letter-spacing: .4px; opacity: .7; width: 110px; text-align: right;
    overflow: hidden; text-overflow: ellipsis; }
  .rug small.stil { opacity: .45; }
  .rug u.bron { text-decoration: none; font-size: 10px; font-weight: 500; letter-spacing: .3px; color: var(--t2, #fff); opacity: .6; flex: 0 0 auto; }
  @media (max-width: 1000px) { .rug em { display: none; } }
  @media (max-width: 600px) { .rug small + small { width: auto; max-width: 90px; } }
  /* Het jaartal: helemaal rechts, een vaste kolom, stiller dan de speelduur. */
  .rug small.jaar { width: 30px; font-size: 11px; font-weight: 400; letter-spacing: 0; opacity: .55; text-align: right; }
  @media (max-width: 600px) { .rug small.jaar { width: 28px; max-width: none; } }
  .orde { overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .orde::-webkit-scrollbar { display: none; }
  .orde button { white-space: nowrap; }
  /* De zonekiezer: waar Play speelt, per browser onthouden. */
  .zone { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--zacht); }
  .zone select { appearance: none; -webkit-appearance: none; border: 0; font: inherit; font-size: 13px; color: var(--tekst);
    background: rgba(255,255,255,.08); border-radius: 8px; padding: 5px 26px 5px 10px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--zacht) 50%), linear-gradient(135deg, var(--zacht) 50%, transparent 50%);
    background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
  .rug:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: -2px; }

  /* Het geopende album als boekje (Stacks op het hele scherm op de Mac, StapelOpen.boekje; René, 26 okt 2026: "het design
     van Stacks FullScreen aanhouden"): links de voorkant van rand tot rand, zonder radius, zo groot als de halve breedte of
     de hoogte van het scherm toelaat; rechts de achterkant — artiest en titel, het inlegvel, en onderaan de feitenregel
     met de knoppen. Achtergrond: de rugkleur, donker en gedempt (binnenKleur). Op telefoonbreedte onder elkaar. */
  .open { display: flex; align-items: stretch; background: var(--binnen, #333); opacity: 0; transition: opacity .3s ease-in-out;
    --f: 1.27; --r: 44px; }
  .open.zichtbaar { opacity: 1; }
  .voorkant { flex: 0 0 auto; width: var(--hoes); height: var(--hoes); object-fit: cover; display: block; background: rgba(255,255,255,.06); }
  .achter { flex: 1; min-width: 0; min-height: var(--hoes); display: flex; flex-direction: column;
    padding: var(--r) max(var(--r), env(safe-area-inset-right)) 24px var(--r); }
  .kop .artiest { font-size: 20px; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kop .titel { margin-top: 4px; font-size: 26px; font-weight: 600; color: #fff; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .inleg { margin-top: 26px; }
  .tracks { display: grid; column-gap: 22px; }
  .tracks.twee { grid-auto-flow: column; }
  .track { display: flex; align-items: baseline; gap: 7px; padding: 2.5px 0; cursor: pointer; min-width: 0; }
  .tracks.twee .track { padding: 3.5px 0; }
  .track:hover .titel { color: #fff; }
  .track .nr { flex: 0 0 auto; width: var(--nrb); font-size: calc(11.5px * var(--f)); color: rgba(255,255,255,.4); font-variant-numeric: tabular-nums; }
  .track .titel { font-size: calc(12.5px * var(--f)); color: rgba(255,255,255,.85); line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .track .titel { flex: 1; min-width: 0; }
  .track .tijd { flex: 0 0 auto; margin-left: 4px; font-size: calc(11.5px * var(--f)); color: rgba(255,255,255,.45); font-variant-numeric: tabular-nums; }
  .sessie { margin-top: 8px; font-size: calc(11px * var(--f)); line-height: 1.35; color: rgba(255,255,255,.45); white-space: pre-line; }
  .musici { margin-top: 12px; font-size: calc(11.5px * var(--f)); line-height: 1.35; color: rgba(255,255,255,.7); white-space: pre-line; }
  .vul { flex: 1 0 10px; }
  .info { font-size: calc(11px * var(--f)); color: rgba(255,255,255,.45); padding-bottom: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .knoppen { display: flex; align-items: center; gap: 9px; }
  .knoppen .vul { flex: 1; }
  /* Een klik landt altijd op de knop, nooit op het icoon erin. */
  button svg { pointer-events: none; }
  .knop { appearance: none; border: 0; color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.13); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12); transition: background .15s; }
  .knop:hover { background: rgba(255,255,255,.22); }
  .knop:active { transform: scale(.96); }
  .knop:disabled { opacity: .35; cursor: default; }
  .knop svg { width: 16px; height: 16px; display: block; }
  .knop.woord svg { width: 13px; height: 13px; }
  .knop.rond { width: 34px; height: 34px; border-radius: 50%; }
  .knop.woord { height: 34px; border-radius: 17px; padding: 0 16px; gap: 7px; font: inherit; font-size: 14px; font-weight: 600; }
  /* Smaller dan een Mac-scherm (de iPad): kleinere randen en letters, zelfde boekje. */
  @media (max-width: 1100px) { .open { --f: 1; --r: 28px; } .kop .artiest { font-size: 17px; } .kop .titel { font-size: 22px; } .inleg { margin-top: 20px; } }
  @media (max-width: 600px) {
    .open { flex-direction: column; --f: .9; --r: 18px; }
    .voorkant { width: 100%; height: auto; aspect-ratio: 1; }
    .achter { min-height: 0; padding: 18px var(--rand-r) 18px var(--rand); }
    .tracks { grid-auto-flow: row; }
    .info { padding-bottom: 14px; }
  }
  /* ---- De lessenaar (Basso, Lessenaar.swift): Now Playing rechts als in/uitklapper (René, 26 okt) ----
     Een overlay die over de pagina glijdt (René: "dat lijkt logischer"): de stapel houdt zijn breedte. Het paneel begint
     onder de kop, zodat de knop rechtsboven bereikbaar blijft. Ingeklapt: de speelcapsule onderin. */
  /* 304 breed (René: "What's Next even smal, en de hele NP daarmee wat smaller"): alles op de breedte van de hoes, 256. */
  :root { --paneel: 304px; }
  body { transition: none; }
  .lessenaar { position: fixed; top: var(--kop-h, 60px); right: 0; bottom: 0; width: var(--paneel); z-index: 4; display: flex; flex-direction: column;
    background: #141416; border-left: 1px solid rgba(255,255,255,.08); overflow: hidden; color: #fff; box-shadow: -12px 0 40px rgba(0,0,0,.45);
    transform: translateX(100%); transition: transform .38s cubic-bezier(.2,.9,.25,1); }
  /* Eigen klassenaam: .open is het opengeklapte album (opacity 0 tot hij infadet) — daarmee bleef het paneel zwart. */
  .lessenaar.uitgeklapt { transform: none; }
  .doek { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
  .doek img { position: absolute; inset: -25%; width: 150%; height: 150%; object-fit: cover; filter: blur(48px) saturate(1.85) brightness(.62);
    opacity: 0; transition: opacity 1.5s; }
  .doek img.aan { opacity: 1; }
  .doek::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.5); }
  .gezicht { position: absolute; inset: 0 0 48px 0; display: flex; flex-direction: column; transition: opacity .25s ease-out; }
  .gezicht.weg { opacity: 0; pointer-events: none; }
  .np { display: flex; flex-direction: column; align-items: center; padding-top: 24px; }
  .np-hoes { width: 256px; height: 256px; border-radius: 10px; object-fit: cover; box-shadow: 0 9px 36px rgba(0,0,0,.5);
    background: rgba(255,255,255,.06); }
  .klok { width: 256px; }
  .lijn { position: relative; height: 14px; margin: 4px 4px 0; cursor: pointer; touch-action: none; }
  .lijn::before, .lijn i { content: ''; position: absolute; left: 0; bottom: 3px; height: 1px; border-radius: 1px; }
  .lijn::before { right: 0; background: rgba(255,255,255,.18); box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .lijn i { background: #fff; width: 0; }
  .tijden { display: flex; align-items: baseline; gap: 8px; font-size: 10px; color: rgba(255,255,255,.5); font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .tijden .mid { flex: 1; min-width: 0; display: flex; justify-content: center; align-items: baseline; gap: 9px; white-space: nowrap; overflow: hidden; }
  .tijden .zn { font-size: 10px; font-weight: 600; color: rgba(255,255,255,.6); overflow: hidden; text-overflow: ellipsis; }
  .tijden em { font-style: normal; font-size: 8.5px; font-weight: 600; letter-spacing: .6px; color: rgba(255,255,255,.6);
    padding: 0 3px; border: .75px solid rgba(255,255,255,.4); border-radius: 3px; }
  .meta { width: 256px; margin-top: 34px; display: flex; flex-direction: column; gap: 4px; }
  .meta .t { font-size: 15px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta .a, .meta .b { font-size: 13px; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .b { color: rgba(255,255,255,.5); cursor: pointer; }
  .meta .b:hover { color: rgba(255,255,255,.8); }
  .transport { width: 256px; margin-top: 30px; display: flex; align-items: center; justify-content: space-between; }
  .transport button { appearance: none; border: 0; background: none; color: #fff; cursor: pointer; padding: 0; display: flex;
    align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; }
  .transport button:active { transform: scale(.9); }
  .transport button:disabled { opacity: .3; cursor: default; }
  .transport svg { width: 20px; height: 20px; }
  .transport .modus { color: rgba(255,255,255,.45); }
  .transport .modus svg { width: 16px; height: 16px; }
  .transport .modus.aan { color: #fff; }
  .transport .speel { width: 46px; height: 46px; background: #fff; color: #1a1a1a; transition: transform .16s cubic-bezier(.3,1.6,.5,1); }
  .transport .speel svg { width: 17px; height: 17px; }
  .volume { width: 256px; margin-top: 22px; display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,.55); }
  .volume[hidden] { display: none; }
  .volume svg { width: 14px; height: 14px; display: block; }
  /* Het luidsprekertje op de kantlijn van de hoes (René: "moet iets naar links"): het icoon begint 2.5 van de 20 binnen
     zijn vak, dus 2 punt terug; een klik zet het geluid uit en aan. */
  .volume .luid { appearance: none; border: 0; background: none; padding: 0; margin-left: -2px; color: inherit; cursor: pointer; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; height: 20px; }
  .volume .luid:hover { color: #fff; }
  .volume.stil input { opacity: .4; }
  .volume input { flex: 1; appearance: none; -webkit-appearance: none; height: 14px; background: none; cursor: pointer; margin: 0; }
  .volume input::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, rgba(255,255,255,.85) var(--v, 0%), rgba(255,255,255,.18) var(--v, 0%)); }
  .volume input::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(255,255,255,.18); }
  .volume input::-moz-range-progress { height: 3px; border-radius: 2px; background: rgba(255,255,255,.85); }
  .volume input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .volume input::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; }
  .volume span { width: 24px; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
  /* What's Next: onderin verankerd, precies zoveel rijen als er passen (thumbs 36, 14/12, tijden, haarlijntjes). */
  .volgende { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 16px 0 6px; overflow: hidden; }
  .volgende .blok { width: 256px; }
  .volgende[hidden] { display: none; }
  .blok { background: rgba(255,255,255,.07); border-radius: 12px; padding: 10px 10px 4px; cursor: pointer; }
  .kopje { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.55); padding: 0 2px 6px; }
  .rij { display: flex; align-items: center; gap: 10px; padding: 5px 2px; border-top: .5px solid rgba(255,255,255,.08); }
  .kopje + .rij { border-top: 0; }
  .rij img { width: 36px; height: 36px; border-radius: 5px; object-fit: cover; flex: 0 0 auto; background: rgba(255,255,255,.06); }
  .rij div { flex: 1; min-width: 0; }
  .rij b, .rij small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rij b { font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,.92); }
  .rij small { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 1px; }
  .rij > span { font-size: 12px; color: rgba(255,255,255,.45); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .wachtrij { overflow-y: auto; padding: 18px 18px 12px; }
  .wachtrij .rij { cursor: pointer; border-radius: 8px; padding: 5px 6px; }
  .wachtrij .rij:hover { background: rgba(255,255,255,.06); }
  .wachtrij .rij.nu { background: rgba(255,255,255,.1); }
  .wachtrij .rij.nu + .rij { border-top-color: transparent; }
  .wachtrij h2 { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.55); margin: 0 4px 8px; }
  .wissel { position: absolute; left: 24px; right: 24px; bottom: 10px; display: flex; gap: 3px; padding: 3px; border-radius: 10px; background: rgba(255,255,255,.08); }
  .wissel button { appearance: none; border: 0; background: none; flex: 1; height: 28px; border-radius: 8px; font: inherit; font-size: 12px;
    font-weight: 600; color: rgba(255,255,255,.6); cursor: pointer; }
  .wissel button[aria-pressed="true"] { background: rgba(255,255,255,.16); color: #fff; }
  /* Vast rechtsboven in de kop (René), ook als de kop over twee regels gaat. */
  header { padding-right: calc(var(--rand-r) + 44px); }
  .paneelknop { position: absolute; right: var(--rand-r); top: calc(env(safe-area-inset-top) + 14px); appearance: none; border: 0; background: rgba(255,255,255,.08); color: var(--tekst); width: 32px; height: 28px; border-radius: 8px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .paneelknop svg { width: 15px; height: 15px; }
  .paneelknop[aria-pressed="true"] { background: rgba(255,255,255,.18); }
  /* De speelcapsule (SpeelCapsule): onderin het midden van de stapel als de lessenaar dicht is; een klik zet hem terug. */
  .capsule { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 18px); left: 50%; z-index: 3; width: min(390px, calc(100vw - 32px)); height: 56px;
    transform: translate(-50%, 140%); transition: transform .38s cubic-bezier(.2,.9,.25,1); display: flex; align-items: center; gap: 11px; padding: 0 12px 0 10px;
    border-radius: 28px; background: rgba(28,28,32,.62); -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: inset 0 0 0 .75px rgba(255,255,255,.12), 0 5px 24px rgba(0,0,0,.4); cursor: pointer; }
  .capsule.aan { transform: translate(-50%, 0); }
  .capsule img { width: 40px; height: 40px; border-radius: 9px; object-fit: cover; background: rgba(255,255,255,.08); }
  .capsule div { flex: 1; min-width: 0; }
  .capsule b, .capsule small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .capsule b { font-size: 13.5px; font-weight: 500; }
  .capsule small { font-size: 12px; color: rgba(255,255,255,.55); }
  .capsule button { appearance: none; border: 0; background: none; color: #fff; width: 30px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .capsule button svg { width: 17px; height: 17px; }
  .capsule button + button svg { width: 15px; height: 15px; opacity: .85; }
  /* Smal (iPad staand, telefoon): het paneel zweeft over de stapel, zoals op Harry. */
  @media (max-width: 600px) { :root { --paneel: 100vw; } }
  #melding { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%);
    background: rgba(40,40,46,.92); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); color: var(--tekst);
    font-size: 13px; padding: 9px 16px; border-radius: 18px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 5; }
  #melding.aan { opacity: 1; }
  #leeg { padding: 40px var(--rand); color: var(--zacht); font-size: 14px; }
  @media (max-width: 600px) { :root { --letter: 11px; } h1 { font-size: 20px; } .zone { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="naam"><h1>Stacks</h1><span id="tel"></span></div>
  <div class="filter" hidden>
    <span class="glas"></span>
    <input id="filterVeld" type="search" placeholder="Filter" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Filter">
    <button class="wis" aria-label="Clear filter"></button>
  </div>
  <button id="filterKnop" class="kopknop" title="Filter (⌘F)" aria-label="Filter" aria-keyshortcuts="Meta+F Control+F"></button>
  <label class="zone">Play on <select id="zone" aria-label="Zone"></select></label>
  <div class="orde" role="group" aria-label="Order">
    <button data-orde="released" data-deep hidden>Release Date</button>
    <button data-orde="az">A-Z</button>
    <button data-orde="artist">By Artist</button>
    <button data-orde="added" data-deep hidden>Date Added</button>
    <button data-orde="shuffled">Shuffled</button>
    <button data-orde="catno" data-deep hidden>Catalog #</button>
  </div>
  <button id="paneelKnop" class="paneelknop" title="Now Playing (⌥N)" aria-label="Now Playing" aria-keyshortcuts="Alt+N" aria-pressed="false"></button>
</header>
<main id="stapel"></main>
<div id="leeg" hidden></div>
<div id="melding" role="status"></div>
<aside id="lessenaar" class="lessenaar" aria-label="Now Playing">
  <div class="doek"><img alt=""></div>
  <div class="gezicht np-gezicht">
    <div class="np">
      <img class="np-hoes" alt="">
      <div class="klok">
        <div class="lijn"><i></i></div>
        <div class="tijden"><span class="pos">0:00</span><span class="mid"><em hidden></em><span class="zn"></span></span><span class="duur"></span></div>
      </div>
      <div class="meta"><div class="t"></div><div class="a"></div><div class="b"></div></div>
      <div class="transport">
        <button class="modus" data-doe="shuffle" title="Shuffle" aria-label="Shuffle"></button>
        <button data-doe="previous" title="Previous" aria-label="Previous"></button>
        <button class="speel" data-doe="playpause" title="Play" aria-label="Play"></button>
        <button data-doe="next" title="Next" aria-label="Next"></button>

      </div>
      <div class="volume" hidden><button class="luid" aria-label="Mute"></button><input type="range" min="0" max="100" step="1" aria-label="Volume"><span class="vw"></span></div>
    </div>
    <div class="volgende"><div class="blok"></div></div>
  </div>
  <div class="gezicht wachtrij weg"></div>
  <div class="wissel">
    <button data-gezicht="np" aria-pressed="true">Now Playing</button>
    <button data-gezicht="queue" aria-pressed="false">Queue</button>
  </div>
</aside>
<div id="capsule" class="capsule" role="button" aria-label="Show Now Playing">
  <img alt=""><div><b></b><small></small></div>
  <button data-doe="playpause" aria-label="Play"></button><button data-doe="next" aria-label="Next"></button>
</div>
<script>
// De volgordes van Basso's Stacks voor zover de officiële API ze toelaat (By Artist, A-Z, Shuffled); Release Date,
// Date Added en Catalogue Number komen met Deep Roon. Lidwoorden tellen niet mee, zoals in Basso (zonderLidwoord).
const stapel = document.getElementById('stapel'), tel = document.getElementById('tel'), leeg = document.getElementById('leeg');
let albums = [], orde = 'artist', schudVolgorde = new Map();
try { orde = localStorage.getItem('stacks.orde') || orde; } catch {}

const vergelijk = new Intl.Collator(undefined, { sensitivity: 'base', numeric: true });
const zonderLidwoord = t => (/^(the|a|an|de|het|een)\s+(.+)$/i.exec(t ?? '') || [, , t ?? ''])[2];
const sleutel = a => a.image || (a.artist + '\u0000' + a.title);
// Roon schrijft samenwerkingen als "A/B/C" (soms met spaties); op de rug zoals Apple: "A, B & C".
function namen(s) {
  const n = (s ?? '').split('/').map(x => x.trim()).filter(Boolean);
  return n.length > 1 ? n.slice(0, -1).join(', ') + ' & ' + n.at(-1) : (n[0] ?? '');
}

let metDeep = false, deepBezig = false, catOrde = 'catno', catRug = 'sorted', capsuleAan = true;
// Binnen een artiest op releasedatum, oudste eerst (René, 26 okt; Basso's albums-artist: artiest, released, titel).
// Zonder Deep Roon geen datum: dan op titel.
const uitgave = a => a.released ?? (a.year ? String(a.year) : '');
const opArtiest = (a, b) => vergelijk.compare(zonderLidwoord(a.artist), zonderLidwoord(b.artist))
  || (uitgave(a) && uitgave(b) ? uitgave(a).localeCompare(uitgave(b)) : 0) || vergelijk.compare(a.title, b.title);
const catSleutel = a => (catOrde === 'barcode' ? a.barcode : a.catno) || null;
function gesorteerd() {
  const k = albums.slice();
  // De volgordes van Deep Roon (Basso: Release Date en Date Added nieuwste eerst). Wat geen datum of nummer heeft, onderaan.
  if (orde === 'released') return k.sort((a, b) => (b.released ?? String(b.year ?? '')).localeCompare(a.released ?? String(a.year ?? '')) || opArtiest(a, b));
  if (orde === 'added') return k.sort((a, b) => (a.added ?? 1e9) - (b.added ?? 1e9) || opArtiest(a, b));
  if (orde === 'catno') return k.sort((a, b) => {
    const x = catSleutel(a), y = catSleutel(b);
    return x && y ? vergelijk.compare(x, y) || opArtiest(a, b) : x ? -1 : y ? 1 : opArtiest(a, b);
  });
  if (orde === 'az') return k.sort((a, b) => vergelijk.compare(zonderLidwoord(a.title), zonderLidwoord(b.title)) || vergelijk.compare(a.artist, b.artist));
  if (orde === 'shuffled') {
    for (const a of k) if (!schudVolgorde.has(sleutel(a))) schudVolgorde.set(sleutel(a), Math.random());
    return k.sort((a, b) => schudVolgorde.get(sleutel(a)) - schudVolgorde.get(sleutel(b)));
  }
  return k.sort(opArtiest);
}

// Basso's dikte: 20 minuten of minder 22 punt, 100 of meer 42; zonder speelduur de dikte van 45 minuten.
const dikte = a => a.len ? 22 + Math.min(Math.max(a.len / 60 - 20, 0), 80) / 80 * 20 : null;
// Boven het uur zoals Apple Music het schrijft (StapelRug.duurTekst).
function duurTekst(sec) {
  if (!sec) return '';
  const m = Math.round(sec / 60);
  return m < 60 ? `${m} min` : m % 60 === 0 ? `${m / 60} hr` : `${Math.floor(m / 60)} hr ${m % 60} min`;
}

function kleur(el, a) {
  if (a.bg) { el.style.setProperty('--bg', '#' + a.bg); el.style.setProperty('--t1', '#' + a.t1); el.style.setProperty('--t2', '#' + a.t2); }
}

const ruggen = new Map();   // sleutel → element, zodat een nieuwe lading alleen de kleuren bijwerkt
const albumVan = new WeakMap();   // element → album
function vul(el, a) {
  // Op naam gesorteerd staat de titel vooraan (Basso, titelEerst): de rug leest in de volgorde van de stapel.
  const [eerst, dan] = orde === 'az' ? [a.title, namen(a.artist)] : [namen(a.artist), a.title];
  el.children[0].textContent = eerst; el.children[1].textContent = dan;
  // Geen tooltip bij het aanwijzen (René); de naam voor schermlezers.
  el.setAttribute('aria-label', `${namen(a.artist)} — ${a.title}`);
  const h = dikte(a); if (h) el.style.setProperty('--h', h + 'px'); else el.style.removeProperty('--h');
  // Het schildje: het echte formaat (24/96, MQA, Mixed …), niet bij cd-kwaliteit.
  const fmt = a.fmt && a.fmt !== '16/44.1' ? a.fmt : null;
  const em = el.querySelector('em'), duur = el.querySelector('.duur'), nr = el.querySelector('.nr'), jr = el.querySelector('.jaar');
  em.textContent = fmt ?? ''; em.hidden = !fmt;
  duur.textContent = duurTekst(a.len); duur.hidden = !a.len;
  // De bron op de rug alleen als hetzelfde album er vaker staat (René: "twee versies — 1 van de 1, 1 van de ander").
  // Met Roon's versie erbij (29 okt, forum): "Local · MFSL SACD" tegenover "Qobuz".
  const bron = el.querySelector('.bron'), dubbel = a.bron && (dubbelen.get(dubbelSleutel(a)) ?? 0) > 1;
  bron.textContent = dubbel ? [a.bron, a.versie].filter(Boolean).join(' · ') : ''; bron.hidden = !dubbel;
  // Het nummer rechts in een eigen kolom: bij de volgorde Catalogue Number (zonder nummer de barcode, stiller), of altijd
  // als dat in Roon zo is ingesteld (dan alleen waar het er is).
  const opNummer = orde === 'catno', toon = opNummer || catRug === 'always';
  nr.textContent = toon ? (catSleutel(a) ?? (opNummer ? a.barcode : null) ?? '') : '';
  nr.hidden = !toon || !metDeep;
  nr.classList.toggle('stil', opNummer && !catSleutel(a));
  // Het jaartal helemaal rechts, in een eigen kolom (René: "voor de rust").
  const jaar = a.released?.slice(0, 4) ?? (a.year ? String(a.year) : '');
  jr.textContent = jaar; jr.hidden = !metDeep;
  kleur(el, a); albumVan.set(el, a);
}

// Albums die er vaker staan (zelfde titel en artiest, hoofdletters en leestekens tellen niet).
const dubbelSleutel = a => sorteerSleutel(a.title).replace(/[^\p{L}\p{N}]/gu, '') + '|' + sorteerSleutel(a.artist).replace(/[^\p{L}\p{N}]/gu, '');
let dubbelen = new Map();
function telDubbelen() { dubbelen = new Map(); for (const a of albums) dubbelen.set(dubbelSleutel(a), (dubbelen.get(dubbelSleutel(a)) ?? 0) + 1); }

// Het filter: elk woord moet ergens in het album voorkomen (Basso: "elk woord, zonder op hoofdletters of accenten te letten").
let filterTekst = '';
const plat = t => (t ?? '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const hooi = a => plat([a.title, namen(a.artist), a.artist, a.label, a.catno, a.barcode, a.released?.slice(0, 4) ?? a.year, a.fmt, a.bron, a.versie, a.verborgen && 'hidden'].filter(Boolean).join(' '));
function gefilterd(lijst) {
  const woorden = plat(filterTekst).split(/\s+/).filter(Boolean);
  return woorden.length ? lijst.filter(a => { const h = hooi(a); return woorden.every(w => h.includes(w)); }) : lijst;
}

function teken() {
  telDubbelen();
  const frag = document.createDocumentFragment();
  const rij = gefilterd(gesorteerd());
  if (open && !rij.some(a => sleutel(a) === open.sleutel)) sluit();
  telTekst();
  for (const a of rij) {
    let el = ruggen.get(sleutel(a));
    if (!el) {
      el = document.createElement('div'); el.className = 'rug'; el.tabIndex = 0; el.setAttribute('role', 'button');
      el.append(document.createElement('b'), document.createElement('span'), document.createElement('i'),
                document.createElement('em'), document.createElement('small'), document.createElement('small'), document.createElement('small'));
      el.children[4].className = 'duur'; el.children[5].className = 'nr'; el.children[6].className = 'jaar';
      const bron = document.createElement('u'); bron.className = 'bron'; el.insertBefore(bron, el.querySelector('em'));
      ruggen.set(sleutel(a), el);
    }
    vul(el, a);
    frag.append(el);
    if (open && open.sleutel === sleutel(a)) frag.append(open.el);
  }
  stapel.replaceChildren(frag);
  for (const b of document.querySelectorAll('.orde button')) b.setAttribute('aria-pressed', b.dataset.orde === orde);
}

// Het aantal in de kop; met een filter "12 of 1,858 albums".
let pending = 0;
function telTekst() {
  if (!albums.length) { tel.textContent = ''; return; }
  const n = filterTekst.trim() ? gefilterd(albums).length : null;
  tel.textContent = `${n != null ? `${n.toLocaleString('en')} of ` : ''}${albums.length.toLocaleString('en')} albums${pending ? ` · coloring ${pending.toLocaleString('en')}` : ''}`;
}

async function haal(eenmaal) {
  let d;
  try { d = await (await fetch('/api/albums', { cache: 'no-store' })).json(); }
  catch { leeg.hidden = false; leeg.textContent = 'Stacks is not reachable'; return setTimeout(haal, 5000); }
  const eerste = albums.length === 0, wasDeep = metDeep, wasAantal = albums.length, wasBezig = deepBezig;
  albums = d.albums; metDeep = !!d.deep; deepBezig = !!d.deepBusy;
  const catWas = catOrde + catRug; catOrde = d.catorde ?? 'catno'; catRug = d.catrug ?? 'sorted'; capsuleAan = d.capsule !== 'off';
  for (const b of document.querySelectorAll('.orde [data-deep]')) b.hidden = !metDeep;
  // Valt Deep Roon weg, dan valt een volgorde van Deep Roon terug op By Artist.
  if (!metDeep && ['released', 'added', 'catno'].includes(orde)) orde = 'artist';
  if (metDeep && !wasDeep) { try { orde = localStorage.getItem('stacks.orde') || orde; } catch {} }
  pending = d.pending; telTekst();
  leeg.hidden = albums.length > 0;
  leeg.textContent = !d.core ? 'Waiting for Roon. Enable Stacks in Roon › Settings › Extensions' : d.loading ? 'Reading your library…' : 'No albums';
  // Opnieuw ordenen alleen als de stapel echt anders is (eerste lading, albums erbij of eraf, Deep Roon komt of gaat of is
  // klaar met lezen, een andere catalogussleutel); anders de ruggen ter plekke bijwerken, zodat de stapel niet onder je
  // vingers verschuift terwijl de gegevens binnenkomen.
  if (eerste || albums.length !== wasAantal || metDeep !== wasDeep || (wasBezig && !deepBezig) || catOrde + catRug !== catWas) teken();
  else { telDubbelen(); for (const a of albums) { const el = ruggen.get(sleutel(a)); if (el) vul(el, a); } }
  if (!eenmaal && (!d.core || d.loading || d.pending || d.deepBusy)) setTimeout(haal, d.pending || d.deepBusy ? 3000 : 2000);
  else if (!eenmaal) setTimeout(haal, 60000);   // rustig bijhouden: nieuwe albums, Deep Roon die opkomt of wegvalt
}

// ---- het geopende album ----
// Eén tegelijk; een klik op dezelfde rug of Esc sluit. Eerst ophalen, dan in één beweging openen (Basso: "opent in twee
// fasen … kan dat in 1 beweging?"): tracks en hoes zijn er al als het vlak verschijnt.
let open = null, zonesNu = [], zoneId = null;
try { zoneId = localStorage.getItem('stacks.zone'); } catch {}
const melding = document.getElementById('melding');
let meldTimer;
function meld(t) { melding.textContent = t; melding.classList.add('aan'); clearTimeout(meldTimer); meldTimer = setTimeout(() => melding.classList.remove('aan'), 2600); }

// De iconen, getekend in de geest van Basso's SF Symbols (play.fill, pause.fill, shuffle, text.insert, text.append,
// backward.end.fill, forward.end.fill): lijnen van 1.7 met ronde kapjes op een raster van 20, play/pause/vorige/volgende gevuld.
const LIJN = '<g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';
const ICOON = {
  play: '<path fill="currentColor" d="M6 3.9v12.2c0 .9.9 1.4 1.7.9l9.3-6.1c.7-.4.7-1.4 0-1.8L7.7 3c-.8-.5-1.7 0-1.7.9z"/>',
  pause: '<rect fill="currentColor" x="4.5" y="3" width="4" height="14" rx="1.2"/><rect fill="currentColor" x="11.5" y="3" width="4" height="14" rx="1.2"/>',
  vorige: '<rect fill="currentColor" x="3" y="4" width="2.2" height="12" rx="1.1"/><path fill="currentColor" d="M17 5.1v9.8c0 .8-.9 1.3-1.6.8L7.6 11c-.6-.4-.6-1.4 0-1.8l7.8-4.9c.7-.5 1.6 0 1.6.8z"/>',
  volgende: '<rect fill="currentColor" x="14.8" y="4" width="2.2" height="12" rx="1.1"/><path fill="currentColor" d="M3 5.1v9.8c0 .8.9 1.3 1.6.8l7.8-4.7c.6-.4.6-1.4 0-1.8L4.6 4.3C3.9 3.8 3 4.3 3 5.1z"/>',
  shuffle: LIJN + '<path d="M2.5 6h2.6c1.8 0 2.9.9 4 2.6l1.8 2.8c1.1 1.7 2.2 2.6 4 2.6h2.6"/><path d="M2.5 14h2.6c1.2 0 2.1-.4 2.9-1.2"/><path d="M12.1 7.2c.8-.8 1.7-1.2 2.9-1.2h2.5"/><path d="M15.6 3.9 17.7 6l-2.1 2.1"/><path d="M15.6 11.9l2.1 2.1-2.1 2.1"/></g>',
  next: LIJN + '<path d="M9 5h8.5"/><path d="M2.5 10h15"/><path d="M2.5 15h15"/></g><path fill="currentColor" d="M2.5 2.6v4.8c0 .5.5.8.9.5l3.4-2.4c.3-.2.3-.8 0-1L3.4 2.1c-.4-.3-.9 0-.9.5z"/>',
  terug: '<path fill="currentColor" d="M9.6 5.2v9.6c0 .7-.8 1.1-1.4.7L2.2 10.7c-.5-.4-.5-1.1 0-1.4l6-4.8c.6-.4 1.4 0 1.4.7zm8.4 0v9.6c0 .7-.8 1.1-1.4.7l-6-4.8c-.5-.4-.5-1.1 0-1.4l6-4.8c.6-.4 1.4 0 1.4.7z"/>',
  vooruit: '<path fill="currentColor" d="M10.4 5.2v9.6c0 .7.8 1.1 1.4.7l6-4.8c.5-.4.5-1.1 0-1.4l-6-4.8c-.6-.4-1.4 0-1.4.7zM2 5.2v9.6c0 .7.8 1.1 1.4.7l6-4.8c.5-.4.5-1.1 0-1.4l-6-4.8C2.8 4.1 2 4.5 2 5.2z"/>',
  herhaal: LIJN + '<path d="M3.5 9.5V8.2c0-1.8 1.4-3.2 3.2-3.2h10"/><path d="M14.6 2.4 17.2 5l-2.6 2.6"/><path d="M16.5 10.5v1.3c0 1.8-1.4 3.2-3.2 3.2h-10"/><path d="M5.4 17.6 2.8 15l2.6-2.6"/></g>',
  herhaal1: LIJN + '<path d="M3.5 9.5V8.2c0-1.8 1.4-3.2 3.2-3.2h10"/><path d="M14.6 2.4 17.2 5l-2.6 2.6"/><path d="M16.5 10.5v1.3c0 1.8-1.4 3.2-3.2 3.2h-10"/><path d="M5.4 17.6 2.8 15l2.6-2.6"/></g><path fill="currentColor" d="M9.3 8.6h1.6v4.2h-1.1V9.9l-.7.3-.3-.9z"/>',
  luid: '<path fill="currentColor" d="M2.5 7.4v5.2c0 .4.3.7.7.7h2.6l3.6 3c.5.4 1.2 0 1.2-.6V4.3c0-.6-.7-1-1.2-.6l-3.6 3H3.2c-.4 0-.7.3-.7.7z"/>' + LIJN.replace('1.7', '1.5') + '<path d="M13.3 7.2c.8.7 1.2 1.7 1.2 2.8s-.4 2.1-1.2 2.8"/><path d="M15.6 4.9c1.4 1.3 2.2 3.1 2.2 5.1s-.8 3.8-2.2 5.1"/></g>',
  // speaker.slash: de luidspreker zonder golven, met een streep erdoor.
  stil: '<path fill="currentColor" d="M2.5 7.4v5.2c0 .4.3.7.7.7h2.6l3.6 3c.5.4 1.2 0 1.2-.6V4.3c0-.6-.7-1-1.2-.6l-3.6 3H3.2c-.4 0-.7.3-.7.7z"/>' + LIJN.replace('1.7', '1.5') + '<path d="M13.2 7.6l4.6 4.8"/><path d="M17.8 7.6l-4.6 4.8"/></g>',
  zoek: LIJN.replace('1.7', '1.6') + '<path d="M2.5 4.5h7"/><path d="M2.5 9h4"/><path d="M2.5 13.5h4"/><circle cx="12.5" cy="11" r="3.6"/><path d="M15.2 13.7 17.8 16.3"/></g>',
  wis: '<circle fill="currentColor" cx="10" cy="10" r="8"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>',
  paneel: LIJN.replace('1.7', '1.5') + '<rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M12.5 3.8v12.4"/></g>',
  later: LIJN + '<path d="M2.5 5h15"/><path d="M2.5 10h15"/><path d="M2.5 15h7.5"/><path d="M14.5 12.2v5.6"/><path d="M11.7 15h5.6"/></g>',
};
const svg = n => `<svg viewBox="0 0 20 20" aria-hidden="true">${ICOON[n]}</svg>`;
// Een icoon alleen vervangen als het echt verandert (René: "shuffle doet het niet"): de lessenaar ververst elke 2 s, en een
// icoon dat tussen indrukken en loslaten werd vervangen, kostte in Safari de klik.
function zetIcoon(knop, naam) { if (knop.dataset.icoon !== naam) { knop.dataset.icoon = naam; knop.innerHTML = svg(naam); } }

// binnenKleur uit Stapel.swift: dezelfde tint, verzadiging ×1.1 (hooguit 0.75), helderheid 45% (tussen 0.20 en 0.30).
function binnenKleur(hex) {
  if (!hex) return '#333';
  const v = parseInt(hex, 16), r = (v >> 16 & 255) / 255, g = (v >> 8 & 255) / 255, b = (v & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d > 0) { h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; if (h < 0) h += 1; }

  const k = n => { const x = (n + h * 6) % 6; return hel - hel * sat * Math.max(0, Math.min(x, 4 - x, 1)); };
  return `rgb(${[5, 3, 1].map(n => Math.round(k(n) * 255)).join(',')})`;
}

// De uitvoerenden uit de tracks (Roon's subtitle per track), zonder de albumartiest zelf: de officiële API kent geen
// credits, dit is wat er wél is. Hooguit tien namen.
function musici(a, tracks) {
  const albumNamen = new Set(a.artist.split('/').map(x => x.trim().toLowerCase()));
  const tel = new Map();
  for (const t of tracks) for (const n of t.artist.split(/,\s*/).map(x => x.trim()).filter(Boolean)) {
    const k = n.replace(/[’']/g, "'").toLowerCase();
    if (!albumNamen.has(k)) tel.set(n, (tel.get(n) ?? 0) + 1);
  }
  return [...tel.entries()].sort((x, y) => y[1] - x[1]).slice(0, 10).map(x => x[0]);
}

// De speelduur in de feitenregel (Basso, onzeDuur): "51 min", "1 h 18 min".
function onzeDuur(sec) {
  if (!sec) return '';
  const m = Math.round(sec / 60);
  return m >= 60 ? (m % 60 === 0 ? `${m / 60} h` : `${Math.floor(m / 60)} h ${m % 60} min`) : `${Math.max(1, m)} min`;
}

// Roon's credits (Deep Roon) zoals Basso's inlegvel ze toont: de musici als "Naam, instrument, instrument" (hooguit drie,
// klein geschreven), wie schreef, produceerde of vastlegde niet erbij; daaronder de sessie: "Produced by …", "Engineer …".
function uitCredits(credits) {
  const geenSpeler = /compos|lyric|writ|arrang|author|librett|conduct/i;
  const perNaam = new Map();
  for (const c of credits) {
    if (c.category !== 'performance' || geenSpeler.test(c.role)) continue;
    for (const n of c.names ?? []) {
      if (!perNaam.has(n)) perNaam.set(n, []);
      const r = c.role.toLowerCase();
      if (!['performer', 'guest', 'primary artist', 'main artist', 'featured artist'].includes(r) && !perNaam.get(n).includes(r)) perNaam.get(n).push(r);
    }
  }
  const musici = [...perNaam].slice(0, 14).map(([n, r]) => r.length ? `${n}, ${r.slice(0, 3).join(', ')}` : n);
  const rol = r => credits.filter(c => c.role === r).flatMap(c => c.names ?? []);
  const sessie = [];
  if (rol('Producer').length) sessie.push(`Produced by ${rol('Producer').join(', ')}`);
  const tech = [...new Set([...rol('Engineer'), ...rol('Recording Engineer')])];
  if (tech.length) sessie.push(`Engineer ${tech.join(', ')}`);
  return { musici, sessie };
}

// De tracks krijgen voorrang op de volle breedte (René, bij Nightfall en Field: "mooier als het niet naar twee kolommen

// Opnieuw de maat nemen als de stapel van breedte verandert (René, 26 okt: "bij NP in/uit moet de open uitklapper opnieuw

let breedteWas = 0;

// Een verborgen album (René, 29 okt) komt helemaal uit het interne protocol; de rest via zijn plek in Roon's lijst.
const albumAdres = a => a.verborgen ? `/api/album?hidden=1&deep=${a.deep}`
  : `/api/album?n=${a.n}&image=${encodeURIComponent(a.image ?? '')}${a.deep ? `&deep=${a.deep}` : ''}`;

async function openAlbum(rug) {

  if (bezig === k) return;
  bezig = k;

    let r = await fetch(albumAdres(a));

    if (r.status === 409) { await new Promise(ok => setTimeout(ok, 2500)); await haal(true); const b = albums.find(x => sleutel(x) === k); if (b) r = await fetch(albumAdres(b)); }
    d = await r.json();

stapel.addEventListener('click', e => { const r = e.target.closest('.rug'); if (r) openAlbum(r); });

// ---- de lettertoetsen (Basso, DesktopAZ) ----
// Bij A-Z en By Artist: wat je typt (een seconde lang telt het op) springt naar de eerste rug die zo begint, zonder
// lidwoord; is er geen, dan naar de eerstvolgende (typ Q in een kast zonder Q en je landt bij de R). Bij Catalogue Number
// op het nummer zelf ("ECM 1", "7K"). Een zachte landing: in één keer naar vijf ruggen ervoor, het laatste stukje glijdt.
const sorteerSleutel = t => zonderLidwoord(t ?? '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
let getypt = '', getyptOp = 0;
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1 || e.target.closest?.('select, input, textarea')) return;
  if (!['az', 'artist', 'catno'].includes(orde)) return;

  const doel = rij.find(a => veld(a).startsWith(getypt)) ?? rij.find(a => vergelijk.compare(veld(a), getypt) > 0);

function spring(el) {
  if (!el) return;

  window.scrollTo({ top: voor.getBoundingClientRect().top + scrollY - kopH, behavior: 'instant' });
  requestAnimationFrame(() => window.scrollTo({ top: y, behavior: 'smooth' }));

  vol.classList.toggle('stil', stilNu);
  if (z?.volume && !inp.matches(':active')) {
    inp.min = z.volume.min; inp.max = z.volume.max; inp.step = z.volume.step || 1; inp.value = z.volume.value;
    toonVolume();
  }
  // De capsule
  cap.classList.toggle('aan', capsuleAan && !lesOpen && !!nu);
  zetBeeld(cap.querySelector('img'), hoesUrl(nu?.image, 120));
  cap.querySelector('b').textContent = nu?.title ?? ''; cap.querySelector('small').textContent = nu?.artist ?? '';
  zetIcoon(cap.querySelector('[data-doe="playpause"]'), speelt ? 'pause' : 'play');
  zetIcoon(cap.querySelector('[data-doe="next"]'), 'vooruit');
}
function toonVolume() {
  const inp = les.querySelector('.volume input'), min = Number(inp.min), max = Number(inp.max), v = Number(inp.value);
  inp.style.setProperty('--v', `${(v - min) / (max - min || 1) * 100}%`);
  les.querySelector('.volume .vw').textContent = Math.round(v);
}

async function doe(wat) {
  const z = zoneNu(); if (!z) return;
  try {
    if (wat === 'shuffle') await post('/api/settings', { zone: z.id, shuffle: !z.shuffle });
    else if (wat === 'repeat') await post('/api/settings', { zone: z.id, loop: { disabled: 'loop', loop: 'loop_one', loop_one: 'disabled' }[z.loop] ?? 'loop' });
    else await post('/api/control', { zone: z.id, control: wat });
  } catch (e) { meld(e.message); }
  setTimeout(() => { haalZones(); haalWachtrij(); }, 350);
}
les.querySelector('.transport').addEventListener('click', e => { const b = e.target.closest('button'); if (b) doe(b.dataset.doe); });
cap.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { e.stopPropagation(); doe(b.dataset.doe); } });

// Zoeken in de track: klikken of slepen op de lijn; losgelaten = seek.
const lijn = les.querySelector('.lijn');
function lijnFractie(e) { const r = lijn.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); }
lijn.addEventListener('pointerdown', e => {
  const z = zoneNu(); if (!z?.now?.len || !z.kan.seek) return;
  lijn.setPointerCapture(e.pointerId);
  const zet = ev => { les.querySelector('.lijn i').style.width = `${lijnFractie(ev) * 100}%`; les.querySelector('.pos').textContent = tijd(lijnFractie(ev) * z.now.len); };
  zet(e);
  lijn.onpointermove = zet;
  lijn.onpointerup = ev => {
    lijn.onpointermove = lijn.onpointerup = null;
    const s = lijnFractie(ev) * z.now.len;
    seekBasis = { seek: s, op: performance.now(), speelt: z.state === 'playing' };
    post('/api/seek', { zone: z.id, seconds: s }).catch(er => meld(er.message));
  };
});

// Het luidsprekertje: geluid uit en aan.
les.querySelector('.volume .luid').addEventListener('click', () => {
  if (!zoneNu()) return;
  post('/api/mute', { zone: zoneId }).then(() => setTimeout(haalZones, 300)).catch(e => meld(e.message));
});

// Het volume: meteen tonen, rustig doorgeven.
let volTimer;
les.querySelector('.volume input').addEventListener('input', e => {
  toonVolume(); clearTimeout(volTimer);
  volTimer = setTimeout(() => post('/api/volume', { zone: zoneId, value: Number(e.target.value) }).catch(er => meld(er.message)), 120);
});

// Het album in de stapel: een klik op de albumregel brengt je erheen en klapt het open.
les.querySelector('.meta .b').addEventListener('click', () => {
  const nu = zoneNu()?.now; if (!nu) return;
  const a = albums.find(x => x.title === nu.album && (!nu.artist || namen(x.artist).includes(nu.artist.split(/[,/&]/)[0].trim()))) ?? albums.find(x => x.title === nu.album);
  const el = a && ruggen.get(sleutel(a));
  if (!el) return meld('Not in the stack');
  if (!open || open.sleutel !== sleutel(a)) openAlbum(el); else spring(el);
});

// De wachtrij: What's Next (zoveel rijen als er passen) en het tweede gezicht.
async function haalWachtrij() {
  if (!zoneId || !lesOpen) return;
  try { wachtrijNu = (await (await fetch(`/api/queue?zone=${encodeURIComponent(zoneId)}`, { cache: 'no-store' })).json()).items ?? []; } catch { return; }
  toonWachtrij();
}
function rijEl(i, nu) {
  const r = document.createElement('div'); r.className = 'rij' + (nu ? ' nu' : '');
  const img = new Image(); img.alt = ''; img.decoding = 'sync'; if (i.image) img.src = hoesUrl(i.image, 120);
  const d = document.createElement('div'), b = document.createElement('b'), sm = document.createElement('small'), t = document.createElement('span');
  b.textContent = i.title; sm.textContent = i.artist; t.textContent = tijd(i.len);
  d.append(b, sm); r.append(img, d, t);
  return r;
}
// Alleen opnieuw opbouwen als de wachtrij, de ruimte of het gezicht verandert (René: "de hoesjes trillen bij het herladen"
// — elke 3 s alles opnieuw, met nieuwe beeldjes).
let wachtrijStempel = '';
function toonWachtrij() {
  const stempel = wachtrijNu.map(i => i.id).join(',') + '|' + les.querySelector('.volgende').clientHeight + '|' + lesGezicht;
  if (stempel === wachtrijStempel) return;
  wachtrijStempel = stempel;
  // What's Next: alles na wat nu speelt (Roon's wachtrij begint bij het huidige nummer).
  const blok = les.querySelector('.blok'), na = wachtrijNu.slice(1);
  blok.replaceChildren();
  blok.parentElement.hidden = !na.length;
  if (na.length) {
    const k = document.createElement('div'); k.className = 'kopje'; k.textContent = "What's Next";
    blok.append(k);
    const ruimte = blok.parentElement.clientHeight - 16 - 6 - 14 - 26;
    const passen = Math.max(0, Math.min(7, Math.floor(ruimte / 47)));
    for (const i of na.slice(0, passen)) blok.append(rijEl(i, false));
    blok.parentElement.hidden = passen === 0;
  }
  if (lesGezicht !== 'queue') return;
  const w = les.querySelector('.wachtrij');
  const h = document.createElement('h2'); h.textContent = wachtrijNu.length ? 'Queue' : 'The queue is empty';
  const rijen = wachtrijNu.map((i, n) => {
    const r = rijEl(i, n === 0);
    if (n > 0) r.addEventListener('click', () => post('/api/jump', { zone: zoneId, item: i.id }).then(() => setTimeout(() => { haalZones(); haalWachtrij(); }, 400)).catch(e => meld(e.message)));
    return r;
  });
  const y = w.scrollTop;
  w.replaceChildren(h, ...rijen); w.scrollTop = y;
}
window.addEventListener('resize', () => { if (lesOpen) toonWachtrij(); });
setInterval(() => { if (lesOpen) haalWachtrij(); }, 3000);
zetLessenaar(lesOpen, false);

haalZones(); setInterval(haalZones, 2000);

document.querySelector('.orde').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.orde === 'shuffled') schudVolgorde.clear();
  orde = b.dataset.orde;
  try { localStorage.setItem('stacks.orde', orde); } catch {}
  teken(); window.scrollTo({ top: 0 });
});
haal();
</script>
